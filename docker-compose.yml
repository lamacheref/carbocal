# Tire l'image publiée sur GitHub Container Registry (backup/registre public).
#
#   docker compose up -d
#
# Prérequis : l'image ghcr.io/lamacheref/carbocal est publique,
# ou `docker login ghcr.io -u lamacheref` avec un PAT (read:packages).
#
# Variable (optionnelle) : CARBOCAL_SERVER_URL (défaut https://mail.smiden.fr)

services:
  carbocal:
    image: ghcr.io/lamacheref/carbocal:latest
    pull_policy: always
    container_name: carbocal
    ports:
      - "8123:8000"
    environment:
      - CARBOCAL_SERVER_URL=${CARBOCAL_SERVER_URL:-https://mail.smiden.fr}
    restart: unless-stopped